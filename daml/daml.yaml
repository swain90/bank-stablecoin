sdk-version: 2.10.2
name: bank-stablecoin
source: daml
version: 1.0.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
init-script: Init:init
data-dependencies: []

# JSON API options with CORS enabled
json-api-options:
  - --address=0.0.0.0

start-navigator: false
build-options:
  - --target=1.15

codegen:
  js:
    output-directory: ui/src/daml.js
    npm-scope: daml.js
    package-name: bank-stablecoin